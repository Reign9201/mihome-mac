name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: ./scripts/build-macos.sh ${{ matrix.arch }}
      - run: |
          DMG=$(find dist/macos -maxdepth 1 -name "*-${{ matrix.arch }}.dmg" -print -quit)
          test -n "$DMG"
          ./scripts/verify-macos-bundle.sh "$DMG" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7
        with:
          name: MiHome-Mac-ad-hoc-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.sha256
          if-no-files-found: error
          retention-days: 14
