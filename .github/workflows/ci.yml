name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject local marketing and social publishing files
        run: |
          forbidden=$(git ls-files | grep -Ei \
            '(^|/)(marketing|xhs|social-publishing)/|(^|/)(publish-state|publish-copy)(\.|-)|(^|/)xhs-|xiaohongshu|redbook|小红书' \
            || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Marketing and social publishing files must stay outside this repository."
            printf '%s\n' "$forbidden"
            exit 1
          fi

  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Run 10-round UI screenshot regression
        run: npm run test:ui
        working-directory: desktop
        env:
          UI_REGRESSION_ROUNDS: 10
      - name: Run 150-camera scale check
        run: npm run test:perf
        working-directory: desktop
        env:
          # Hosted runners vary in speed; keep the stream caps and paging
          # assertions strict and leave timing budgets to local runs.
          PERF_CPU_THROTTLE: 1
          PERF_IDLE_MS: 5000
      - name: Upload UI regression screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-screenshots
          path: desktop/tests/artifacts
          if-no-files-found: ignore
      - run: npm audit --audit-level=high
        working-directory: desktop
      - name: Download sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          helpers/go2rtc/fetch.sh
          helpers/ffmpeg/fetch.sh
      - run: bash -n helpers/go2rtc/fetch.sh helpers/ffmpeg/fetch.sh helpers/ffmpeg/build-minimal.sh scripts/build-macos.sh scripts/strip-macos-binary.sh scripts/verify-macos-bundle.sh
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run build -- --no-bundle
        working-directory: desktop

  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest:
          - core
          - desktop/src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Run cargo-audit directly instead of rustsec/audit-check. That action
      # reports through the Checks API, and on push events the run has no
      # matching check suite, so it fails with "Not Found - checks/runs" even
      # when no vulnerability exists. cargo-audit's exit status is the whole
      # answer, which is all this job needs.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Two informational advisories are ignored for the desktop binary, and
      # only there: glib 0.18 and proc-macro-error reach the graph solely
      # through tauri's Linux/BSD target (gtk 0.18, webkit2gtk 2), which a
      # macOS build never compiles. gtk 0.18 pins glib ^0.18, so the patched
      # glib 0.20 cannot be selected until tauri moves off gtk 0.18.
      # --deny makes every-other warning and every vulnerability fail the job,
      # so a new advisory still breaks CI. Drop the ignores once tauri updates.
      - name: Audit ${{ matrix.manifest }}
        working-directory: ${{ matrix.manifest }}
        run: |
          ignore=()
          if [ "${{ matrix.manifest }}" = "desktop/src-tauri" ]; then
            ignore+=(--ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2024-0429)
          fi
          cargo audit --deny warnings "${ignore[@]}"
