name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path core/Cargo.toml

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm audit --audit-level=high
        working-directory: desktop
      - name: Download go2rtc
        run: helpers/go2rtc/fetch.sh
      - run: bash -n helpers/go2rtc/fetch.sh scripts/build-macos.sh scripts/verify-macos-bundle.sh
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run build -- --no-bundle
        working-directory: desktop
