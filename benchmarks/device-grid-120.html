<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设备网格 120 项滚动基准</title>
<link rel="stylesheet" href="../desktop/ui/styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--bg, #f4f0e8); }
  .bench-shell { width: 1180px; margin: 0 auto; }
  .bench-head { display:flex; justify-content:space-between; align-items:baseline; margin: 0 0 16px; }
  .bench-head h1 { margin:0; font: 600 18px/1.3 var(--display, sans-serif); }
  .bench-head span { font: 12px/1.4 var(--sans, sans-serif); color: var(--ink2, #6b645b); }
  .scroll { height: 720px; overflow: auto; border: 1px solid var(--line, #ded8cc); border-radius: 16px; padding: 16px; background: var(--surface, #fffdf8); }
  #result { margin-top: 16px; padding: 12px 14px; background: #1e1b18; color: #f5efe4; border-radius: 10px; font: 12px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="bench-shell">
  <div class="bench-head"><h1>设备网格 · 120 项</h1><span>与设备页相同的 .device-grid / .device-card</span></div>
  <div class="scroll" id="scroll"></div>
  <pre id="result">running</pre>
</div>
<script src="../desktop/ui/icons.js"></script>
<script>
(() => {
  const icons = window.MiIcons;
  const kinds = Object.keys(icons.icons);
  const rooms = ['客厅','卧室','书房','餐厅','厨房','次卧','阳台','玄关'];
  const names = ['吸顶灯','壁挂灯','台灯','风扇灯','空调','窗帘','摄像头','扫地机','净化器','加湿器','插座','传感器','路由器','电视','音箱','门锁','热水器','晾衣架'];
  const scroll = document.getElementById('scroll');
  const grid = document.createElement('div');
  grid.className = 'device-grid';
  const cards = [];
  for (let i = 0; i < 120; i++) {
    const kind = kinds[i % kinds.length];
    const family = icons.familyFor(kind);
    const card = document.createElement('button');
    card.className = 'device-card';
    card.type = 'button';
    card.innerHTML = `<div class="device-card-top"><div class="device-glyph" data-family="${family}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">${icons.icons[kind]}</svg></div><span class="device-state"><i class="status-dot online"></i></span></div><strong>${names[i % names.length]} ${String(i + 1).padStart(2, '0')}</strong><div class="device-room">${rooms[i % rooms.length]}</div>`;
    grid.appendChild(card);
    cards.push(card);
  }
  scroll.appendChild(grid);
  const result = document.getElementById('result');
  const frames = [];
  let last = 0;
  function finish() {
    const sorted = [...frames].sort((a,b)=>a-b);
    const pct = p => sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * p))] || 0;
    result.textContent = JSON.stringify({
      cards: cards.length,
      gridHeight: Math.round(grid.getBoundingClientRect().height),
      scrollHeight: scroll.scrollHeight,
      frames: frames.length,
      avgMs: +(frames.reduce((a,b)=>a+b,0)/Math.max(1,frames.length)).toFixed(2),
      p50Ms: +pct(.50).toFixed(2),
      p95Ms: +pct(.95).toFixed(2),
      p99Ms: +pct(.99).toFixed(2),
      maxMs: +Math.max(...frames, 0).toFixed(2),
      over16ms: frames.filter(v=>v>16.7).length,
      over33ms: frames.filter(v=>v>33.3).length
    }, null, 2);
  }
  function step(t) {
    if (last) frames.push(t - last);
    last = t;
    scroll.scrollTop += 6;
    if (frames.length < 240) requestAnimationFrame(step);
    else finish();
  }
  requestAnimationFrame(() => requestAnimationFrame(step));
  setTimeout(() => { if (result.textContent === 'running') finish(); }, 3500);
})();
</script>
</body>
</html>
