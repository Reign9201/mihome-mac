[package]
name = "mihome-mac"
version = "0.1.0"
description = "MiHome Mac desktop shell"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["sync", "time"] }
mihome-core = { path = "../../core" }

[profile.release]
lto = true
codegen-units = 1
# Rust 1.99 defaults release builds to strip=debuginfo, which requires the
# optional rust-objcopy tool. The macOS bundle hook strips the final binary.
strip = false
panic = "abort"
incremental = false
