[package]
name = "mihome-mac"
version = "1.2.0"
description = "MiHome Mac desktop shell"
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
tokio = { version = "1", features = ["sync", "time", "net", "macros", "process"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rand = "0.8"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
base64 = "0.22"
lark-channel = { version = "0.6", default-features = false, features = ["reqwest-transport", "websocket"] }
dingtalk-stream-sdk = "0.2"
async-trait = "0.1"
mihome-core = { path = "../../core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-speech = "0.3.2"
block2 = "0.6"

[profile.release]
lto = true
codegen-units = 1
# Rust 1.99 defaults release builds to strip=debuginfo, which requires the
# optional rust-objcopy tool. The macOS bundle hook strips the final binary.
strip = false
panic = "abort"
incremental = false
