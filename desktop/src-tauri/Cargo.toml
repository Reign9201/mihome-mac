[package]
name = "mihome-mac"
version = "0.1.0"
description = "MiHome Mac desktop shell"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
mihome-core = { path = "../../core" }
